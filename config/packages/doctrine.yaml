doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            User:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Users/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Users\Domain'
                alias: Users
            Journal:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Journals/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Journals\Domain'
                alias: Journal
            Animal:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Animals/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Animals\Domain'
                alias: Animal
            Entry:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Entries/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Entries\Domain'
                alias: Entry
            Image:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Images/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Images\Domain'
                alias: Image
            Shared:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Shared/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Shared\Domain\ValueObject'
                alias: Shared
            Location:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Locations/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Locations\Domain'
                alias: Location
            Forum:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Forums/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Forums\Domain'
                alias: Forum
            Post:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Posts/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Posts\Domain'
                alias: Post
            Report:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/Reports/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\Reports\Domain'
                alias: Report
            ContactRequest:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/src/MiMascota/ContactRequests/Infrastructure/Doctrine'
                prefix: 'App\MiMascota\ContactRequests\Domain'
                alias: Report


        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
